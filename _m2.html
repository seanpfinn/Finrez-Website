<!DOCTYPE html><html><body style="margin:0">
<iframe id="f" src="/" style="width:390px;height:6000px;border:0"></iframe>
<pre id="p" style="position:fixed;top:0;right:0;background:#fff;font:11px monospace;margin:0"></pre>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>setTimeout(()=>{
  const d=f.contentDocument;
  const t=d.querySelector('.pc-toggle');
  const r=t.getBoundingClientRect();
  const opts=[...d.querySelectorAll('.pct-opt')].map(o=>{const b=o.getBoundingClientRect();return Math.round(b.width)+'x'+Math.round(b.height)});
  document.getElementById('p').textContent='y='+Math.round(r.top+f.getBoundingClientRect().top)+' track='+Math.round(r.width)+'x'+Math.round(r.height)+' opts='+opts.join(',');
},2500));
</script></body></html>
